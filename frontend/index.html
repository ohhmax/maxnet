<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>MAXNET // ENTERPRISE GATEWAY</title>

  <!-- Immediate Inline Zero-Latency Loader (Instant paint, zero dark scroll bleed) -->
  <style>
    :root { --bg-root: #080808; }
    html[data-theme="light"], body[data-theme="light"] { --bg-root: #f4f4f5; }
    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-root);
      background: var(--bg-root);
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-root);
      background: var(--bg-root);
    }
    #maxnet-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-root);
      z-index: 999999;
    }
    .m-spinner {
      width: 36px;
      height: 36px;
      border: 2.5px solid rgba(255,255,255,0.08);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: m-spin 0.75s linear infinite;
      box-sizing: border-box;
    }
    html[data-theme="light"] .m-spinner {
      border-color: rgba(0,0,0,0.08);
      border-top-color: #10b981;
    }
    @keyframes m-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="maxnet-shell">
  <!-- Minimalist SPA Root with Pure Centered Circle Loader -->
  <div id="maxnet-root">
    <div id="maxnet-loader">
      <div class="m-spinner"></div>
    </div>
  </div>

  <!-- Ultra-Fast High-Performance Modern Vite Orchestrator -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

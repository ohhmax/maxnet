name: GitLab Mirror & Auto Backup

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_run:
    workflows:
      - "MaxNet Universal Router Firmware Engine"
      - "Build Specific Router Model Firmware"
    types:
      - completed
  schedule:
    - cron: '0 */6 * * *' # Auto-backup every 6 hours
  workflow_dispatch:

concurrency:
  group: gitlab-mirror-sync
  cancel-in-progress: false

jobs:
  gitlab-mirror:
    name: Mirror Repository to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Remote Branches & Tags
        run: |
          echo "Fetching all remote branches, tags and references from GitHub..."
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          git fetch origin '+refs/notes/*:refs/notes/*' 2>/dev/null || true

      - name: Push Full Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is not set in repository Secrets! Please add GITLAB_TOKEN in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Remove local origin/HEAD pointer so it does not attempt to push a branch named HEAD
          git remote set-head origin -d 2>/dev/null || true

          # Configure GitLab remote with OAuth2 authentication token
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.com/ohhmax/maxnet.git"
          git remote add gitlab "$GITLAB_URL" 2>/dev/null || git remote set-url gitlab "$GITLAB_URL"

          echo "Syncing all branches to https://gitlab.com/ohhmax/maxnet..."
          git push gitlab "refs/remotes/origin/*:refs/heads/*" --force --prune

          echo "Syncing all tags to GitLab..."
          git push gitlab --tags --force

          echo "Syncing git notes (if any)..."
          git push gitlab "refs/notes/*:refs/notes/*" --force 2>/dev/null || true

          echo "=========================================================="
          echo "Full repository mirror to GitLab completed successfully!"
          echo "Destination: https://gitlab.com/ohhmax/maxnet"
          echo "=========================================================="

name: MAXNET Model-Wise Build & Validation Engine

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Router Model to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - jidu6911
          - jidu6811
          - jidu6611
          - jidu6411
          - jidu6111
          - jidu6801
          - jidu6401
          - jidu6601
          - jidu6701
          - jidu6101
          - jidu6j01
      channel:
        description: 'Firmware Release Channel (staging or stable)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - stable
      publish_release:
        description: 'Publish release candidate after build & verification'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  version:
    name: Generate Semantic Version & Target Matrix
    runs-on: ubuntu-22.04
    outputs:
      semver: ${{ steps.versioning.outputs.semver }}
      tag_name: ${{ steps.versioning.outputs.tag_name }}
      channel: ${{ steps.versioning.outputs.channel }}
      build_num: ${{ steps.versioning.outputs.build_num }}
    steps:
      - name: Calculate Semantic Version
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          BRANCH="${{ github.ref_name }}"
          CHANNEL="${{ inputs.channel }}"
          [ -z "$CHANNEL" ] && [ "$BRANCH" = "staging" ] && CHANNEL="staging"
          [ -z "$CHANNEL" ] && CHANNEL="staging"

          if [ "$CHANNEL" = "staging" ]; then
            SEM_VER="v2.2.${RUN_NUM}-rc1"
            TAG_NAME="v2.2.${RUN_NUM}-staging"
          else
            SEM_VER="v2.2.${RUN_NUM}"
            TAG_NAME="v2.2.${RUN_NUM}-b${RUN_NUM}"
          fi
          echo "semver=${SEM_VER}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "build_num=${RUN_NUM}" >> $GITHUB_OUTPUT

  build:
    name: Build Model Matrix
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qualcommbe
            subtarget: ipq95xx
            name: "Qualcomm IPQ9574 AX6000"
            device_script: "add_device.py"
            mk_file: "target/linux/qualcommbe/image/ipq95xx.mk"
            bindir: "bin/targets/qualcommbe/ipq95xx"
            models: "jidu6811,jidu6911,jidu6611,jidu6411,jidu6111"
          - target: mediatek
            subtarget: filogic
            name: "MediaTek Filogic 830 AX6000"
            device_script: "add_device_mediatek.py"
            mk_file: "target/linux/mediatek/image/filogic.mk"
            bindir: "bin/targets/mediatek/filogic"
            models: "jidu6801,jidu6401,jidu6601,jidu6701,jidu6101,jidu6j01"
    steps:
      - name: Determine Target Inclusion
        id: target_check
        run: |
          REQ_MODEL="${{ inputs.model }}"
          [ -z "$REQ_MODEL" ] && REQ_MODEL="all"
          MODELS="${{ matrix.models }}"
          if [ "$REQ_MODEL" = "all" ] || echo "$MODELS" | grep -qw "$REQ_MODEL"; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Custom Repository
        if: steps.target_check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Free Disk Space
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Setup Node.js & Compile Production Frontend
        if: steps.target_check.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite Frontend
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          cd custom/frontend
          npm ci || npm install
          npm run build
          cp -a ../files/www/dist/. ../files/www/
          chmod -R 0755 ../files/www/cgi-bin
          chmod 0755 ../files/www/cgi-bin/*

      - name: Clone OpenWrt Master Tree
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          rm -rf openwrt
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp -r custom/files openwrt/

      - name: Apply Hardware Device Trees & Overlays
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          if [ "${{ matrix.target }}" = "qualcommbe" ]; then
            mkdir -p openwrt/target/linux/qualcommbe/dts/qcom/
            cp -r custom/target/linux/qualcommbe/* openwrt/target/linux/qualcommbe/
            sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set\nCONFIG_DEBUG_INFO_NONE=y/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
            sed -i 's/CONFIG_DEBUG_BUGVERBOSE=y/# CONFIG_DEBUG_BUGVERBOSE is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
            sed -i 's/CONFIG_LOCK_DEBUGGING_SUPPORT=y/# CONFIG_LOCK_DEBUGGING_SUPPORT is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
            sed -i 's/CONFIG_ARM64_PTR_AUTH=y/# CONFIG_ARM64_PTR_AUTH is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
            sed -i 's/CONFIG_ARM64_PTR_AUTH_KERNEL=y/# CONFIG_ARM64_PTR_AUTH_KERNEL is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
            sed -i 's/CONFIG_ARM64_GCS=y/# CONFIG_ARM64_GCS is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
            sed -i 's/CONFIG_ARM64_SVE=y/# CONFIG_ARM64_SVE is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          elif [ "${{ matrix.target }}" = "mediatek" ]; then
            mkdir -p openwrt/target/linux/mediatek/dts/
            cp -r custom/target/linux/mediatek/dts/* openwrt/target/linux/mediatek/dts/
          fi

      - name: Register Device Profiles
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          python3 "custom/.github/scripts/${{ matrix.device_script }}" "openwrt/${{ matrix.mk_file }}"

      - name: Configure Feeds and Kconfig
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf tmp
          
          NOW=$(date -u "+%Y-%m-%d %H:%M UTC")
          sed -i "s/VERSION_PLACEHOLDER/${{ needs.version.outputs.semver }}/g" files/etc/banner package/base-files/files/etc/banner 2>/dev/null || true
          sed -i "s/#BUILD_NUM_PLACEHOLDER/#${{ needs.version.outputs.build_num }}/g" files/etc/banner package/base-files/files/etc/banner 2>/dev/null || true
          sed -i "s/BUILD_TIMESTAMP_PLACEHOLDER/${NOW}/g" files/etc/banner package/base-files/files/etc/banner 2>/dev/null || true
          
          mkdir -p files/etc package/base-files/files/etc
          echo "VERSION=${{ needs.version.outputs.semver }}" > files/etc/maxnet_version
          echo "BUILD=${{ needs.version.outputs.build_num }}" >> files/etc/maxnet_version
          echo "TAG=${{ needs.version.outputs.tag_name }}" >> files/etc/maxnet_version
          echo "CHANNEL=${{ needs.version.outputs.channel }}" >> files/etc/maxnet_version
          echo "BUILD_TIMESTAMP=${NOW}" >> files/etc/maxnet_version
          cp -f files/etc/maxnet_version package/base-files/files/etc/maxnet_version 2>/dev/null || true
          
          python3 ../custom/.github/scripts/write_config.py .config --target "${{ matrix.target }}"
          make defconfig
          python3 ../custom/.github/scripts/write_config.py .config --target "${{ matrix.target }}"
          make defconfig

      - name: Download Sources
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile Firmware
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Package & Validate Model Images
        if: steps.target_check.outputs.should_build == 'true'
        run: |
          mkdir -p custom/validated_binaries/${{ matrix.target }}
          BINDIR="openwrt/${{ matrix.bindir }}"
          REQ_MODEL="${{ inputs.model }}"
          [ -z "$REQ_MODEL" ] && REQ_MODEL="all"

          for m in $(echo "${{ matrix.models }}" | tr ',' ' '); do
            if [ "$REQ_MODEL" = "all" ] || [ "$REQ_MODEL" = "$m" ]; then
              echo "Packaging and verifying model $m..."
              python3 custom/.github/scripts/validate_and_package_model.py \
                "$m" \
                "$BINDIR" \
                "custom/validated_binaries/${{ matrix.target }}" \
                "${{ needs.version.outputs.tag_name }}" \
                "${{ needs.version.outputs.channel }}" \
                "${{ needs.version.outputs.build_num }}"
            fi
          done

      - name: Upload Validated Model Artifacts
        if: steps.target_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ matrix.target }}
          path: custom/validated_binaries/${{ matrix.target }}/

  release:
    name: Publish Release Candidate
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Custom Repository
        uses: actions/checkout@v4
        with:
          path: custom
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Qualcomm Artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-qualcommbe
          path: custom/release_binaries
        continue-on-error: true

      - name: Download MediaTek Artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-mediatek
          path: custom/release_binaries
        continue-on-error: true

      - name: Update Model Manifests & Auto-Record Release
        run: |
          python3 custom/.github/scripts/record_model_updates.py \
            custom/release_binaries \
            "${{ needs.version.outputs.tag_name }}" \
            "${{ needs.version.outputs.build_num }}" \
            "${{ needs.version.outputs.semver }}" \
            custom/updates \
            "${{ github.repository }}"

          python3 custom/.github/scripts/update_seen.py custom "${{ github.event_name }}" "${{ github.actor }}" "${{ needs.version.outputs.semver }}"

          cd custom
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/ seen.json
          git commit -m "chore(ota): auto-record build ${{ needs.version.outputs.build_num }} and update seen.json [skip ci]" || true
          git pull --rebase origin main || true
          git push origin main || true

      - name: Publish Staging / Stable Candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          IS_PRERELEASE=""
          [ "$CHANNEL" = "staging" ] && IS_PRERELEASE="--prerelease"

          gh release create "$TAG_NAME" custom/release_binaries/* \
            --repo "${{ github.repository }}" \
            --title "MAXNET $SEMVER ($CHANNEL)" \
            $IS_PRERELEASE \
            --notes ""

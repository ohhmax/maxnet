name: MAXNET Release Promotion Pipeline (Staging -> Production)

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: 'Staging Release Tag to promote (e.g., v2.2.49-staging)'
        required: true
        type: string
      stable_version:
        description: 'Target Stable Version (e.g., 2.2.49)'
        required: true
        type: string
      model:
        description: 'Model to promote'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - jidu6911
          - jidu6811
          - jidu6611
          - jidu6411
          - jidu6111
          - jidu6801
          - jidu6401
          - jidu6601
          - jidu6701
          - jidu6101
          - jidu6j01
      approved:
        description: 'Quality Assurance & Testing Approval Confirmation'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  promote:
    name: Promote Verified Staging Build to Production Stable
    runs-on: ubuntu-22.04
    steps:
      - name: Verify QA Approval
        run: |
          if [ "${{ inputs.approved }}" != "true" ]; then
            echo "Error: Promotion requires explicit QA approval confirmation (approved=true)."
            exit 1
          fi

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Staging Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          mkdir -p staging_downloads
          gh release download "$STAGING_TAG" --dir staging_downloads --repo "${{ github.repository }}"
          ls -la staging_downloads/

      - name: Promote Staging Manifests to Stable
        env:
          STAGING_TAG: ${{ inputs.staging_tag }}
          STABLE_VER: ${{ inputs.stable_version }}
          REQ_MODEL: ${{ inputs.model }}
        run: |
          python3 - << 'EOF'
          import os, sys, json, hashlib, glob

          staging_tag = os.environ.get("STAGING_TAG", "").strip()
          stable_ver = os.environ.get("STABLE_VER", "").strip().lstrip("v")
          req_model = os.environ.get("REQ_MODEL", "all").strip().lower()
          repo = os.environ.get("GITHUB_REPOSITORY", "ohhmax/maxnet")

          manifest_files = glob.glob("models/*/manifest.json")
          promoted_count = 0

          for mf in manifest_files:
              with open(mf, "r") as f:
                  data = json.load(f)
              m_id = data.get("model_id", "").lower()
              if req_model != "all" and m_id != req_model:
                  continue

              canon = data.get("canonical_sysupgrade", f"maxnet-{m_id}-sysupgrade.bin")
              stg_bin = os.path.join("staging_downloads", canon)

              sha256 = None
              size_bytes = 0
              if os.path.exists(stg_bin):
                  size_bytes = os.path.getsize(stg_bin)
                  h = hashlib.sha256()
                  with open(stg_bin, "rb") as bf:
                      while chunk := bf.read(65536):
                          h.update(chunk)
                  sha256 = h.hexdigest()
              elif data["channels"]["staging"].get("sha256"):
                  sha256 = data["channels"]["staging"]["sha256"]
                  size_bytes = data["channels"]["staging"]["size_bytes"]

              if not sha256:
                  print(f"Skipping {m_id}: no binary or staging sha256 found")
                  continue

              stable_tag = f"v{stable_ver}-b{data['channels']['staging'].get('build', 1)}"
              data["channels"]["stable"].update({
                  "channel": "stable",
                  "version": stable_ver,
                  "build": data["channels"]["staging"].get("build", 1),
                  "pushed": True,
                  "release_date": data["channels"]["staging"].get("release_date"),
                  "download_url": f"https://github.com/{repo}/releases/download/{stable_tag}/{canon}",
                  "sha256": sha256,
                  "size_bytes": size_bytes,
                  "signature_url": f"https://github.com/{repo}/releases/download/{stable_tag}/{canon}.sig",
                  "title": f"MAXNET {stable_ver} Production Stable ({m_id.upper()})",
                  "description": f"Tested and approved release candidate promoted from {staging_tag}."
              })

              with open(mf, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")
              print(f"Successfully promoted {m_id} to Stable {stable_ver}")
              promoted_count += 1

          if promoted_count == 0:
              print("No models were promoted!")
              sys.exit(1)
          EOF

      - name: Re-aggregate Unified Manifests
        run: |
          python3 scripts/manage_models.py

      - name: Commit & Push Updated Stable Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ updates.json files/etc/updates.json files/www/updates.json
          git commit -m "chore(release): promote ${STABLE_VER} to stable channel [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create Official Production Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_VER: ${{ inputs.stable_version }}
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          TAG_NAME="v${STABLE_VER}"
          gh release create "$TAG_NAME" staging_downloads/* updates.json \
            --repo "${{ github.repository }}" \
            --title "MAXNET ${STABLE_VER} Production Stable" \
            --notes "### MAXNET Production Release: v${STABLE_VER}
            Promoted from verified staging release \`${STAGING_TAG}\`.
            
            #### Security & Validation Checklist
            - [x] Multi-model hardware target validation passed
            - [x] SHA-256 cryptographic checksums verified
            - [x] Anti-rollback protections enforced
            - [x] Staging QA approval confirmed"

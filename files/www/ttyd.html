<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="1; url=http://10.0.0.1/#terminal">
  <title>MAXNET // Secure Terminal Access Gateway</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #080808;
      --card-bg: #111418;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --primary: #0ea5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .security-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 28px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }
    .title {
      font-size: 19px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    .description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="security-card">
    <div class="badge">MAXNET SECURITY CONTROL</div>
    <h1 class="title">Terminal Access Restricted</h1>
    <p class="description">
      Direct unauthenticated access to the terminal service on port 7681 is blocked for router security. 
      Please log in and access the CLI through the authenticated MAXNET WebUI.
    </p>
    <a href="http://10.0.0.1/#terminal" class="btn">Proceed to MAXNET WebUI</a>
    <div class="footer-note">Redirecting automatically in 1 second...</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MAXNET | Storage &bull; File Manager</title>
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('maxnet_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
</head>

<body>
  <div class="maxnet-nav-header">
    <div class="maxnet-brand">
      <div class="maxnet-brand-icon">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="maxnet-brand-text">
        <span class="maxnet-title">MAXNET <span class="maxnet-title-sep">|</span> <span class="maxnet-version-badge">V2.2.59</span></span>
        <span class="maxnet-subtitle">STORAGE &bull; FILE MANAGER</span>
      </div>
    </div>
    <div class="maxnet-actions">
      <button class="maxnet-theme-toggle" id="dufsThemeToggle" title="Toggle Light/Dark Theme" onclick="toggleDufsTheme()">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <a href="http://10.0.0.1/#setting=acc-smb-storage" class="maxnet-nav-link">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Settings</span>
      </a>
      <a href="http://10.0.0.1/" class="maxnet-nav-link highlight">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dashboard</span>
      </a>
    </div>
  </div>

  <div class="dufs-content-shell">
    <div class="head">
      <div class="breadcrumb"></div>
      <div class="toolbox">
        <a href="" class="control download hidden" title="Download file" download="">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
        <div class="control move-file hidden" title="Move &amp; Rename">
          <svg class="icon-move" viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        </div>
        <div class="control delete-file hidden" title="Delete">
          <svg class="icon-delete" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </div>
        <div class="control upload-file hidden" title="Upload files/folders">
          <label for="file">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </label>
          <input type="file" id="file" title="Upload files/folders" name="file" multiple>
        </div>
        <div class="control new-folder hidden" title="New folder">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        </div>
        <div class="control new-file hidden" title="New File">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </div>
      </div>
      <form class="searchbar hidden">
        <div class="icon">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <input id="search" title="Search folders or files" placeholder="Search files..." name="q" type="text" maxlength="128" autocomplete="off" tabindex="1">
        <input type="submit" hidden />
      </form>
      <div class="toolbox-right">
        <div class="login-btn hidden" title="Login">
          <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Login</span>
        </div>
        <div class="logout-btn hidden" title="Logout">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="user-name"></span>
        </div>
        <div class="save-btn hidden" title="Save file">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save</span>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="index-page hidden">
        <div class="empty-folder hidden"></div>
        <table class="uploaders-table hidden">
          <thead>
            <tr>
              <th class="cell-name" colspan="2">Uploaders</th>
              <th class="cell-status"></th>
              <th class="cell-size"></th>
              <th class="cell-percent"></th>
              <th class="cell-speed"></th>
              <th class="cell-eta"></th>
            </tr>
          </thead>
        </table>
        <div class="table-card-wrapper">
          <table class="paths-table hidden">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="editor-page hidden">
        <div class="not-editable hidden"></div>
        <textarea id="editor" class="editor hidden" aria-label="Editor" cols="10"></textarea>
      </div>
    </div>
  </div>

  <template id="index-data">__INDEX_DATA__</template>
  <script>
    function toggleDufsTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      var next = (current === 'light') ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('maxnet_theme', next);
      } catch (e) {}
    }
  </script>
  <script src="__ASSETS_PREFIX__index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MAXNET // GATEWAY STATUS</title>
  <script>
    (function() {
      try {
        var mode = localStorage.getItem('maxnet_theme_mode') || localStorage.getItem('maxnet_theme');
        var theme = 'dark';
        if (mode === 'day' || mode === 'light') {
          theme = 'light';
        } else if (mode === 'auto') {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #080808;
      --card: #111113;
      --card-inner: #161618;
      --border-main: rgba(255, 255, 255, 0.08);
      --border-sub: rgba(255, 255, 255, 0.04);
      --border-active: rgba(255, 255, 255, 0.16);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --badge-bg: rgba(255, 255, 255, 0.06);
      --badge-border: rgba(255, 255, 255, 0.12);
      --font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Monaco, monospace;
    }

    [data-theme="light"] {
      --bg: #f4f4f5;
      --card: #ffffff;
      --card-inner: #f4f4f5;
      --border-main: #e4e4e7;
      --border-sub: #f4f4f5;
      --border-active: #d4d4d8;
      --text-main: #09090b;
      --text-muted: #52525b;
      --text-dim: #71717a;
      --badge-bg: rgba(0, 0, 0, 0.04);
      --badge-border: #e4e4e7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .error-card {
      background: var(--card);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      max-width: 460px;
      width: 100%;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 5px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text-main);
    }

    .sys-mark {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .error-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .error-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .details-box {
      background: var(--card-inner);
      border: 1px solid var(--border-sub);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .detail-label {
      color: var(--text-dim);
      font-weight: 600;
      font-size: 10.5px;
      text-transform: uppercase;
    }

    .detail-val {
      color: var(--text-main);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 700;
      border-radius: 7px;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border-main);
      background: var(--card-inner);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--border-active);
      background: var(--border-sub);
    }

    .btn-primary {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .footer-note {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="header-bar">
      <span class="status-badge" id="statusBadge">403 FORBIDDEN</span>
      <span class="sys-mark">MAXNET GATEWAY</span>
    </div>

    <div class="title-block">
      <h1 class="error-title" id="errorTitle">Access Restricted</h1>
      <p class="error-desc" id="errorDesc">
        Direct directory listing and unauthenticated endpoint execution are forbidden by gateway security policy.
      </p>
    </div>

    <div class="details-box">
      <div class="detail-row">
        <span class="detail-label">Endpoint</span>
        <span class="detail-val" id="detailPath">/</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Gateway Host</span>
        <span class="detail-val" id="detailHost">10.0.0.1</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Client Address</span>
        <span class="detail-val" id="detailClient">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Timestamp</span>
        <span class="detail-val" id="detailTime">--</span>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return to Dashboard
      </a>
      <button type="button" class="btn" onclick="location.reload()">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Retry
      </button>
    </div>
  </div>

  <div class="footer-note">
    MAXNET Cybernetic Gateway OS &bull; Secure Embedded Architecture
  </div>

  <script>
    (function() {
      var path = window.location.pathname || '/';
      var host = window.location.host || '10.0.0.1';
      document.getElementById('detailPath').textContent = path;
      document.getElementById('detailHost').textContent = host;
      document.getElementById('detailTime').textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

      var badge = document.getElementById('statusBadge');
      var title = document.getElementById('errorTitle');
      var desc = document.getElementById('errorDesc');

      if (path.indexOf('/cgi-bin/') === 0 || path === '/cgi-bin') {
        badge.textContent = '403 FORBIDDEN';
        title.textContent = 'Gateway Access Restricted';
        desc.textContent = 'Direct directory browsing is disabled. Authenticated session token is required to execute gateway CGIs.';
      } else {
        badge.textContent = '404 NOT FOUND';
        title.textContent = 'Resource Not Found';
        desc.textContent = 'The requested endpoint does not exist on this gateway node or has been removed.';
      }
    })();
  </script>
</body>
</html>

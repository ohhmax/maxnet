# MAXNET Ultra High-Performance Kernel & Network Optimization
# Designed for Qualcomm IPQ9574 Quad-Core A73 (6.18 Kernel)

# Network Core & Backlog
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096
net.core.optmem_max = 2048576

# Memory & Socket Buffers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# TCP Acceleration & Low Latency
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Netfilter & Conntrack Capacity
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7400
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 20
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# Bridge netfilter module is not loaded (Pure zero-overhead L2 bridging active)

# MAXNET OS Virtual Memory & OOM Protection Tuning
# High-pressure cache reclaim to prevent Wi-Fi buffer exhaustion
vm.vfs_cache_pressure = 150

# Ensure 16 MB watermark is always reserved for atomic allocations (ath11k skbs)
vm.min_free_kbytes = 16384

# Actively swap idle anonymous pages into ZRAM to keep physical RAM available for network packets
vm.swappiness = 80

# Keep dirty page cache bounded to prevent heavy writeback stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Avoid aggressive memory overcommit
vm.overcommit_memory = 0

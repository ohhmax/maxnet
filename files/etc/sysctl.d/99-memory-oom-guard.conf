# MAXNET OS Virtual Memory & OOM Protection Tuning
# High-pressure cache reclaim to keep RAM free and prevent buffer exhaustion
vm.vfs_cache_pressure = 200

# Reserve 24 MB watermark for atomic allocations (ath11k skbs & packet rings)
vm.min_free_kbytes = 24576

# Actively swap idle anonymous pages into ZRAM to keep physical RAM available
vm.swappiness = 90

# Keep dirty page cache bounded to prevent heavy writeback stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3

# Avoid aggressive memory overcommit
vm.overcommit_memory = 0

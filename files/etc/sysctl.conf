# User defined entries should be added to this file not to /etc/sysctl.d/* as
# that directory is not backed-up by default and will not survive a reimage
# MAXNET HIGH-PERFORMANCE 5G & LAN TUNING
net.core.netdev_budget = 600
net.core.netdev_max_backlog = 10000
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Fast LAN Discovery & Neighbor GC Resilience
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 2048
net.ipv6.neigh.default.gc_thresh3 = 4096
net.ipv4.neigh.default.unres_qlen = 1024
net.ipv4.neigh.default.unres_qlen_bytes = 1048576
net.ipv6.neigh.default.unres_qlen = 1024
net.ipv6.neigh.default.unres_qlen_bytes = 1048576
net.ipv4.conf.br-lan.proxy_arp = 1

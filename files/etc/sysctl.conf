# MAXNET OS Rock-Solid Production Kernel Tunables
# 24/7 Long-Term Reliability for Qualcomm IPQ9574 Quad-Core A73

# Virtual Memory & ZRAM Rock-Solid Stability
vm.min_free_kbytes = 16384
vm.swappiness = 60
vm.vfs_cache_pressure = 150
vm.page-cluster = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
vm.overcommit_memory = 0
vm.panic_on_oom = 0
vm.oom_kill_allocating_task = 0

# Auto-recovery watchdog
kernel.panic = 5

# Network Core & Backlog Resiliency
net.core.netdev_max_backlog = 4096
net.core.netdev_budget = 600
net.core.somaxconn = 4096
net.core.rps_sock_flow_entries = 4096
net.core.default_qdisc = fq_codel

# Restore optimized high-bandwidth BDP windows (16MB)
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# Netfilter & Conntrack Capacity (65k concurrent sessions)
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 20
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 180

# Neighbor (ARP) Table Capacity
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 2048
net.ipv6.neigh.default.gc_thresh3 = 4096
net.ipv4.neigh.default.unres_qlen = 1024
net.ipv4.neigh.default.unres_qlen_bytes = 1048576
net.ipv6.neigh.default.unres_qlen = 1024
net.ipv6.neigh.default.unres_qlen_bytes = 1048576
net.ipv4.conf.br-lan.proxy_arp = 1
